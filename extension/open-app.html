<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Opening NovaMeet…</title>
  <style>
    @font-face {
      font-family: 'DM Sans';
      src: url('fonts/DMSans-Variable.woff2') format('woff2');
      font-weight: 100 1000;
      font-style: normal;
      font-display: swap;
    }
    :root { color-scheme: light; }
    html, body {
      margin: 0;
      height: 100%;
      background: #F0F4F8;
      color: #0F172A;
      font-family: 'DM Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-feature-settings: "ss03", "ss04";
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }
    #status {
      font-size: 28px;
      font-weight: 500;
      line-height: 1.25;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 16px;
      padding: 16px 24px;
      border-radius: 24px;
      background: #2563EB;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
    }
    a:hover { background: #1D4ED8; }
    a:focus-visible { outline: 2px solid #2563EB; outline-offset: 2px; }
    .muted { color: #475569; font-size: 16px; max-width: 360px; line-height: 1.5; margin: 0; }
  </style>
</head>
<body>
  <p id="status">Opening NovaMeet…</p>
  <p class="muted" id="hint" hidden>
    If Chrome asks to open NovaMeet, click <strong>Open</strong>.
    If nothing happens, start NovaMeet from the Start menu once, then try again.
  </p>
  <a id="launch" href="novameet://open">Open NovaMeet app</a>
  <script src="open-app.js"></script>
</body>
</html>
